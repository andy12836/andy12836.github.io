<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>保一專業課程與民防法令題庫複習</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Mobile-first scrolling & touch tap highlights */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    /* Hide scrollbars for clean tab bar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Smooth transition for card elements */
    .card-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased flex flex-col justify-between">

  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-white dark:bg-slate-900 shadow-xl relative pb-24">
    
    <!-- Top Fixed Header -->
    <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h1 class="text-sm font-bold tracking-tight text-slate-800 dark:text-white leading-tight">保一考古題複習</h1>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">消防・防情・民防・警察勤務</p>
          </div>
        </div>

        <!-- Mode & Dark Mode Actions -->
        <div class="flex items-center space-x-1.5">
          <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 dark:text-slate-300 text-sm">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
          </button>
          <button onclick="openResetModal()" title="重設進度" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 dark:text-slate-300 text-sm">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-4 gap-1 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-medium">
        <button id="mode-practice" onclick="switchMode('practice')" class="py-1.5 rounded-lg text-center transition-all bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-300 font-bold">
          <i class="fa-solid fa-bolt mr-1"></i>練習
        </button>
        <button id="mode-exam" onclick="switchMode('exam')" class="py-1.5 rounded-lg text-center transition-all text-slate-600 dark:text-slate-300">
          <i class="fa-solid fa-clipboard-check mr-1"></i>測驗
        </button>
        <button id="mode-mistakes" onclick="switchMode('mistakes')" class="py-1.5 rounded-lg text-center transition-all text-slate-600 dark:text-slate-300 relative">
          <i class="fa-solid fa-circle-xmark mr-1"></i>錯題
          <span id="mistakeBadge" class="hidden absolute -top-1 -right-1 px-1 bg-rose-500 text-white text-[9px] rounded-full">0</span>
        </button>
        <button id="mode-starred" onclick="switchMode('starred')" class="py-1.5 rounded-lg text-center transition-all text-slate-600 dark:text-slate-300 relative">
          <i class="fa-solid fa-star mr-1"></i>收藏
          <span id="starredBadge" class="hidden absolute -top-1 -right-1 px-1 bg-amber-500 text-white text-[9px] rounded-full">0</span>
        </button>
      </div>

      <div class="mt-2.5 flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-0.5 text-[11px]">
        <button onclick="setFilter('all')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 font-medium" data-unit="all">全部 (110)</button>
        <button onclick="setFilter('u1')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u1">消防逃生(25)</button>
        <button onclick="setFilter('u2')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u2">防情傳遞(20)</button>
        <button onclick="setFilter('u3')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u3">替代民防(10)</button>
        <button onclick="setFilter('u4')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u4">民防法令(20)</button>
        <button onclick="setFilter('u5')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u5">疏散避難(15)</button>
        <button onclick="setFilter('u6')" class="unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" data-unit="u6">警察勤務(20)</button>
      </div>

      <!-- Real-time Progress Bar & Stats -->
      <div class="mt-2.5 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
        <div class="flex items-center space-x-2">
          <span id="progressText" class="font-bold text-slate-700 dark:text-slate-200">第 1 / 110 題</span>
          <span id="modeBadgeText" class="px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-[10px]">即時回饋</span>
        </div>
        <div class="flex items-center space-x-2">
          <span>正確率: <strong id="accuracyRate" class="text-indigo-600 dark:text-indigo-400 font-bold">0%</strong></span>
          <span>已答: <span id="answeredCount">0</span></span>
        </div>
      </div>
      <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full mt-1.5 overflow-hidden">
        <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 1%"></div>
      </div>
    </header>

    <main class="flex-1 px-4 py-3 flex flex-col justify-start">
      
      <!-- Empty State Container (for Starred / Mistakes when empty) -->
      <div id="emptyContainer" class="hidden flex-1 flex flex-col items-center justify-center py-16 text-center">
        <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-2xl mb-3">
          <i id="emptyIcon" class="fa-solid fa-inbox"></i>
        </div>
        <h3 id="emptyTitle" class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">目前沒有題目</h3>
        <p id="emptySub" class="text-xs text-slate-400 max-w-xs">切換至全部題目或練習模式開始刷題吧！</p>
      </div>

      <!-- Active Question Card -->
      <div id="questionCard" class="card-transition">
        
        <!-- Question Unit & Type Header Tags -->
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center space-x-1.5">
            <span id="badgeCategory" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/60">
              消防專業課程
            </span>
            <span id="badgeType" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
              是非題
            </span>
          </div>
          <button id="starBtn" onclick="toggleCurrentStar()" class="p-1.5 text-slate-300 dark:text-slate-600 hover:text-amber-500 transition-colors">
            <i class="fa-solid fa-star text-lg"></i>
          </button>
        </div>

        <!-- Question Prompt Text -->
        <div class="mb-4">
          <h2 id="questionPrompt" class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 leading-relaxed tracking-normal">
            題目載入中...
          </h2>
        </div>

        <div id="optionsContainer" class="space-y-2.5">
          <!-- Dynamic buttons rendered via JS -->
        </div>

        <!-- Explanation & Analysis Box (Revealed in practice mode or after exam) -->
        <div id="explanationBox" class="hidden mt-4 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/70 text-xs leading-relaxed space-y-1.5 animate-fadeIn">
          <div class="flex items-center justify-between">
            <span class="font-bold flex items-center text-slate-700 dark:text-slate-200">
              <i class="fa-solid fa-lightbulb text-amber-500 mr-1.5"></i>詳解分析
            </span>
            <span id="correctAnswerBadge" class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 font-bold">
              正確答案: O
            </span>
          </div>
          <p id="explanationText" class="text-slate-600 dark:text-slate-300">
            解析內容說明...
          </p>
        </div>

      </div>

    </main>

    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2.5 px-4">
      <div class="max-w-md mx-auto flex items-center justify-between gap-2">
        
        <!-- Prev Button -->
        <button id="prevBtn" onclick="prevQuestion()" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs flex items-center justify-center space-x-1.5 active:scale-95 transition-transform disabled:opacity-40 disabled:pointer-events-none">
          <i class="fa-solid fa-chevron-left text-[11px]"></i>
          <span>上一題</span>
        </button>

        <!-- Jump to Question Sheet / Drawer Trigger -->
        <button onclick="openDrawer()" class="py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs flex items-center justify-center space-x-1 active:scale-95 transition-transform" title="題號速查表">
          <i class="fa-solid fa-grip text-sm"></i>
          <span id="footerQuestionIndex">1/110</span>
        </button>

        <!-- Next / Submit Button -->
        <button id="nextBtn" onclick="nextQuestion()" class="flex-1 py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs flex items-center justify-center space-x-1.5 shadow-md shadow-indigo-600/20 active:scale-95 transition-transform">
          <span>下一題</span>
          <i class="fa-solid fa-chevron-right text-[11px]"></i>
        </button>

        <!-- Exam Submit Action (Shown during exam mode) -->
        <button id="submitExamBtn" onclick="openExamSubmitConfirm()" class="hidden flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs flex items-center justify-center space-x-1.5 shadow-md shadow-emerald-600/20 active:scale-95 transition-transform">
          <i class="fa-solid fa-paper-plane text-[11px]"></i>
          <span>交卷結算</span>
        </button>

      </div>
    </footer>

    <div id="drawerOverlay" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end" onclick="closeDrawer(event)">
      <div id="drawerContent" class="bg-white dark:bg-slate-900 rounded-t-3xl max-w-md w-full mx-auto max-h-[75vh] flex flex-col p-4 shadow-2xl" onclick="event.stopPropagation()">
        
        <!-- Drawer Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
          <div>
            <h3 class="font-bold text-sm text-slate-800 dark:text-white">題號速查與狀態</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">點擊編號立即跳轉到該題</p>
          </div>
          <button onclick="closeDrawer()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Legend -->
        <div class="flex items-center justify-around py-2.5 text-[11px] text-slate-500 border-b border-slate-100 dark:border-slate-800">
          <span class="flex items-center"><span class="w-3 h-3 rounded-sm bg-slate-200 dark:bg-slate-700 mr-1.5"></span>未作答</span>
          <span class="flex items-center"><span class="w-3 h-3 rounded-sm bg-emerald-500 mr-1.5"></span>答對</span>
          <span class="flex items-center"><span class="w-3 h-3 rounded-sm bg-rose-500 mr-1.5"></span>答錯</span>
          <span class="flex items-center"><span class="w-3 h-3 rounded-sm border-2 border-indigo-600 mr-1.5"></span>目前</span>
        </div>

        <!-- Grid of Question Numbers -->
        <div id="drawerGrid" class="flex-1 overflow-y-auto py-3 grid grid-cols-6 gap-2 text-xs">
          <!-- Filled dynamically -->
        </div>

        <!-- Bottom Action in Drawer -->
        <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
          <button onclick="closeDrawer()" class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs">
            返回做題
          </button>
        </div>

      </div>
    </div>

    <!-- Exam Result Modal -->
    <div id="examResultModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center">
        <div class="w-16 h-16 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto text-2xl mb-3 shadow-inner">
          <i class="fa-solid fa-award"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 dark:text-white">模擬測驗結算報告</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">本次測驗成績統計</p>

        <div class="grid grid-cols-3 gap-2 p-3 bg-slate-50 dark:bg-slate-800/80 rounded-xl mb-4 text-center">
          <div>
            <div id="resultScore" class="text-xl font-black text-indigo-600 dark:text-indigo-400">0</div>
            <div class="text-[10px] text-slate-400">總得分</div>
          </div>
          <div>
            <div id="resultCorrect" class="text-xl font-black text-emerald-500">0</div>
            <div class="text-[10px] text-slate-400">答對題數</div>
          </div>
          <div>
            <div id="resultWrong" class="text-xl font-black text-rose-500">0</div>
            <div class="text-[10px] text-slate-400">答錯題數</div>
          </div>
        </div>

        <div class="space-y-2">
          <button onclick="reviewExamMistakes()" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md shadow-rose-600/20 active:scale-95 transition-all">
            <i class="fa-solid fa-filter mr-1.5"></i>僅檢視錯題
          </button>
          <button onclick="retryExam()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-600/20 active:scale-95 transition-all">
            <i class="fa-solid fa-rotate-left mr-1.5"></i>重新測驗
          </button>
          <button onclick="closeResultModal()" class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs">
            切換為即時練習模式
          </button>
        </div>
      </div>
    </div>

    <!-- Custom Confirmation Modal (Never use alert/confirm) -->
    <div id="confirmModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-xs w-full p-4 shadow-2xl text-center">
        <div id="confirmIcon" class="w-12 h-12 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center mx-auto text-xl mb-3">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h4 id="confirmTitle" class="text-sm font-bold text-slate-800 dark:text-white mb-1">確定要重設嗎？</h4>
        <p id="confirmDesc" class="text-xs text-slate-500 dark:text-slate-400 mb-4">這將會清除您目前的作答紀錄。</p>
        <div class="flex space-x-2">
          <button onclick="closeConfirmModal()" class="flex-1 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold">取消</button>
          <button id="confirmActionBtn" onclick="runConfirmCallback()" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">確定</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 px-4 py-2 bg-slate-900/90 dark:bg-white/90 text-white dark:text-slate-900 text-xs font-medium rounded-full shadow-lg flex items-center space-x-1.5">
      <i id="toastIcon" class="fa-solid fa-check text-emerald-400"></i>
      <span id="toastMsg">提示訊息</span>
    </div>

  </div>

  <script>
    // Complete 110 questions extracted strictly from the provided PDF document
    const QUESTIONS = [
      /* ============================================================
         單元一：消防專業課程 (防火逃生要領與簡易滅火實作) 
         是非題 10 題 + 選擇題 15 題
      ============================================================ */
      {
        id: "u1_tf_1",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "發現火災時，原則上先大喊「失火了、失火了、失火了」，告知大家有火災。",
        options: ["O", "X"],
        answer: 0,
        explanation: "正確。發現火災時，第一時間大聲呼喊警示在場人員，讓大家能及早逃生與應變。"
      },
      {
        id: "u1_tf_2",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "偵煙式住宅用火災警報器裝在廚房最適當，因為廚房比較容易發生火災。",
        options: ["O", "X"],
        answer: 1,
        explanation: "錯誤 (X)。廚房因平時烹飪有油煙及水蒸氣，容易引發偵煙式住警器誤報，廚房應安裝「定溫式」住宅用火災警報器，偵煙式則適合客廳、臥室及樓梯。"
      },
      {
        id: "u1_tf_3",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "室內消防栓之操作，應先按警鈴並打開消防栓箱，拿出瞄子後拉出水帶，最後轉開水閥，方可滅火。",
        options: ["O", "X"],
        answer: 0,
        explanation: "正確。室內消防栓操作最新口訣為「按、開、拿、拉、轉」：按警鈴、開箱門、拿瞄子、拉水帶、轉水閥。"
      },
      {
        id: "u1_tf_4",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "當自家門外發生火災，手觸摸門板有高溫，此時只要「關門」就地避難，再打開窗戶，等待救援。",
        options: ["O", "X"],
        answer: 0,
        explanation: "正確。若摸門把發燙表示門外已有高溫濃煙，不可開門逃生，應關緊房門塞住門縫就地避難，並至臨外窗呼救等待搜救。"
      },
      {
        id: "u1_tf_5",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "滅火器最新使用口訣為「拉、瞄、壓、掃」。",
        options: ["O", "X"],
        answer: 0,
        explanation: "正確。滅火器口訣為「拉(插梢)、瞄(火源根部)、壓(握把)、掃(左右掃射)」。"
      },
      {
        id: "u1_tf_6",
        unit: "u1",
        unitName: "消防專業課程",
        type: "tf",
        prompt: "使用滅火器時，應站在下風位置接近火點，並將皮管瞄準火燄根部掃射。",

    // App State
    let currentFilter = 'all';
    let currentMode = 'practice'; // 'practice' | 'exam' | 'mistakes' | 'starred'

    let mistakeIds = new Set();
    let starredIds = new Set();
    let examSubmitted = false;
    let confirmCallback = null;

    // Load persisted state from localStorage
    function loadStorage() {
      try {
        const savedStarred = localStorage.getItem('p1_starred');
        if (savedStarred) starredIds = new Set(JSON.parse(savedStarred));
        const savedMistakes = localStorage.getItem('p1_mistakes');
        if (savedMistakes) mistakeIds = new Set(JSON.parse(savedMistakes));
        const savedAnswers = localStorage.getItem('p1_answers');
        if (savedAnswers) userAnswers = JSON.parse(savedAnswers);
      } catch (e) {
        console.warn("LocalStorage access error:", e);
      }
    }

    function saveStorage() {
      try {
        localStorage.setItem('p1_starred', JSON.stringify([...starredIds]));
        localStorage.setItem('p1_mistakes', JSON.stringify([...mistakeIds]));
        localStorage.setItem('p1_answers', JSON.stringify(userAnswers));
      } catch (e) {
        console.warn("LocalStorage save error:", e);
      }
    }

    // Theme toggle
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('p1_theme', isDark ? 'dark' : 'light');
      showToast(isDark ? "已切換至深色模式" : "已切換至淺色模式", "fa-circle-half-stroke");
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('p1_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    }

    // Custom Toast Notification
    let toastTimeout = null;
    function showToast(msg, icon = 'fa-check') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon}`;
      toast.classList.remove('opacity-0', 'pointer-events-none');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 1800);
    }

    function filterQuestions() {
      filteredQuestions = QUESTIONS.filter(q => {
        // Unit Filter
        if (currentFilter !== 'all' && q.unit !== currentFilter) return false;
        // Mode Specific Filter
        if (currentMode === 'mistakes' && !mistakeIds.has(q.id)) return false;
        if (currentMode === 'starred' && !starredIds.has(q.id)) return false;
        return true;
      });

      if (currentIndex >= filteredQuestions.length) {
        currentIndex = Math.max(0, filteredQuestions.length - 1);
      }
    }

    function setFilter(unit) {
      currentFilter = unit;
      document.querySelectorAll('.unit-filter-btn').forEach(btn => {
        if (btn.dataset.unit === unit) {
          btn.className = "unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 font-bold";
        } else {
          btn.className = "unit-filter-btn shrink-0 px-2.5 py-1 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300";
        }
      });
      currentIndex = 0;
      filterQuestions();
      renderApp();
    }

    function switchMode(mode) {
      currentMode = mode;
      examSubmitted = false;
      currentIndex = 0;

      // Update Top Nav Mode Pills
      ['practice', 'exam', 'mistakes', 'starred'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "py-1.5 rounded-lg text-center transition-all bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-300 font-bold";
        } else {
          btn.className = "py-1.5 rounded-lg text-center transition-all text-slate-600 dark:text-slate-300 font-normal";
        }
      });

      // Update badge label
      const badgeMap = {
        practice: "即時回饋模式",
        exam: "全真測驗模式",
        mistakes: "錯題專屬刷題",
        starred: "我的重點收藏"
      };
      document.getElementById('modeBadgeText').innerText = badgeMap[mode];

      // Toggle Submit button in Exam mode
      const submitBtn = document.getElementById('submitExamBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (mode === 'exam') {
        submitBtn.classList.remove('hidden');
      } else {
        submitBtn.classList.add('hidden');
        nextBtn.classList.remove('hidden');
      }

      filterQuestions();
      renderApp();
      showToast(`已切換至「${badgeMap[mode]}」`, 'fa-arrows-rotate');
    }

    function renderApp() {
      updateBadges();

      const emptyContainer = document.getElementById('emptyContainer');
      const questionCard = document.getElementById('questionCard');

      if (filteredQuestions.length === 0) {
        questionCard.classList.add('hidden');
        emptyContainer.classList.remove('hidden');

        if (currentMode === 'mistakes') {
          document.getElementById('emptyIcon').className = "fa-solid fa-face-smile text-emerald-500 text-3xl";
          document.getElementById('emptyTitle').innerText = "太棒了！沒有任何錯題";
          document.getElementById('emptySub').innerText = "持續在練習或測驗中保持全對吧！";
        } else if (currentMode === 'starred') {
          document.getElementById('emptyIcon').className = "fa-solid fa-star text-amber-400 text-3xl";
          document.getElementById('emptyTitle').innerText = "尚未加入任何收藏題";
          document.getElementById('emptySub').innerText = "遇到困難或重要題目時，點擊右上角星號即可收藏。";
        } else {
          document.getElementById('emptyIcon').className = "fa-solid fa-inbox text-3xl";
          document.getElementById('emptyTitle').innerText = "該單元無相符題目";
          document.getElementById('emptySub').innerText = "請嘗試選擇其他分類或全部題目。";
        }

        document.getElementById('progressText').innerText = "0 / 0";
        document.getElementById('footerQuestionIndex').innerText = "0/0";
        document.getElementById('progressBar').style.width = "0%";
        return;
      }

      emptyContainer.classList.add('hidden');
      questionCard.classList.remove('hidden');

      const q = filteredQuestions[currentIndex];
      const isStarred = starredIds.has(q.id);
      const userAnswer = userAnswers[q.id];

      // Update Headers
      document.getElementById('badgeCategory').innerText = q.unitName;
      document.getElementById('badgeType').innerText = q.type === 'tf' ? '是非題' : '選擇題';
      document.getElementById('questionPrompt').innerText = `${currentIndex + 1}. ${q.prompt}`;

      // Star Icon
      const starBtn = document.getElementById('starBtn');
      starBtn.innerHTML = `<i class="${isStarred ? 'fa-solid text-amber-500' : 'fa-regular text-slate-300 dark:text-slate-600'} fa-star text-xl"></i>`;

      // Render Options
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl border font-medium text-xs sm:text-sm flex items-start space-x-3 transition-all active:scale-[0.99] ";
        
        let labelIcon = '';
        if (q.type === 'tf') {
          labelIcon = optIdx === 0 ? '<span class="font-bold text-emerald-600 dark:text-emerald-400 mr-1.5">[ 正確 ]</span>' : '<span class="font-bold text-rose-500 mr-1.5">[ 錯誤 ]</span>';
        }

        // Logic for Option Display based on mode & answered state
        const isSelected = userAnswer === optIdx;
        const isCorrect = q.answer === optIdx;

        if (currentMode === 'practice' || examSubmitted) {
          // Instant feedback / Exam reviewed
          if (userAnswer !== undefined) {
            btn.disabled = true;
            if (isCorrect) {
              btn.className += "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-bold ring-2 ring-emerald-500/20";
            } else if (isSelected) {
              btn.className += "border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200 font-semibold";
            } else {
              btn.className += "border-slate-200 dark:border-slate-800 opacity-60 text-slate-600 dark:text-slate-400";
            }
          } else {
            btn.className += "border-slate-200 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-600 bg-white dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 shadow-sm";
          }
        } else {
          // Exam mode before submit
          if (isSelected) {
            btn.className += "border-indigo-600 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-200 font-bold ring-2 ring-indigo-500/20";
          } else {
            btn.className += "border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-slate-700 bg-white dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 shadow-sm";
          }
        }

        btn.onclick = () => handleSelectOption(optIdx);

        btn.innerHTML = `
          <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
            isSelected 
              ? (currentMode === 'practice' || examSubmitted ? (isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-500 text-white') : 'bg-indigo-600 text-white')
              : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
          }">
            ${q.type === 'tf' ? (optIdx === 0 ? 'O' : 'X') : String.fromCharCode(65 + optIdx)}
          </div>
          <div class="flex-1 leading-normal pt-0.5">
            ${labelIcon}${optText}
          </div>
        `;
        optionsContainer.appendChild(btn);
      });

      // Explanation Box Visibility
      const expBox = document.getElementById('explanationBox');
      const expText = document.getElementById('explanationText');
      const ansBadge = document.getElementById('correctAnswerBadge');

      if ((currentMode === 'practice' || examSubmitted) && userAnswer !== undefined) {
        expBox.classList.remove('hidden');
        expText.innerText = q.explanation || "暫無特別備註，掌握基本觀念即可！";
        
        let correctStr = q.type === 'tf' 
          ? (q.answer === 0 ? 'O (正確)' : 'X (錯誤)') 
          : `(${q.answer + 1}) ${q.options[q.answer]}`;
        ansBadge.innerText = `正確答案：${correctStr}`;
      } else {
        expBox.classList.add('hidden');
      }

      // Update Navigation & Bottom bar numbers
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('progressText').innerText = `第 ${currentIndex + 1} / ${filteredQuestions.length} 題`;
      document.getElementById('footerQuestionIndex').innerText = `${currentIndex + 1}/${filteredQuestions.length}`;
      
      const pct = Math.round(((currentIndex + 1) / filteredQuestions.length) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;

      updateGlobalStats();
    }

    function handleSelectOption(optIdx) {
      const q = filteredQuestions[currentIndex];
      
      // Save Answer
      userAnswers[q.id] = optIdx;

      // If in practice mode or mistake mode: verify immediately
      if (currentMode === 'practice' || currentMode === 'mistakes' || currentMode === 'starred') {
        if (optIdx === q.answer) {
          // Correct
          if (mistakeIds.has(q.id)) {
            // Remove from mistakes once answered correctly
            mistakeIds.delete(q.id);
            showToast("答對了！已自錯題庫移除", "fa-circle-check");
          } else {
            showToast("答對了！太棒了", "fa-check");
          }
        } else {
          // Wrong
          mistakeIds.add(q.id);
          showToast("答錯了！已收入錯題專區", "fa-xmark");
        }
      }

      saveStorage();
      renderApp();
    }

    function toggleCurrentStar() {
      if (filteredQuestions.length === 0) return;
      const q = filteredQuestions[currentIndex];
      if (starredIds.has(q.id)) {
        starredIds.delete(q.id);
        showToast("已從收藏庫移除", "fa-star");
      } else {
        starredIds.add(q.id);
        showToast("已加入重點收藏", "fa-star");
      }
      saveStorage();
      renderApp();
    }

    function nextQuestion() {
      if (currentIndex < filteredQuestions.length - 1) {
        currentIndex++;
        renderApp();
      } else {
        showToast("已到達最後一題！", "fa-flag-checkered");
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderApp();
      }
    }

    function updateBadges() {
      const mistakeBadge = document.getElementById('mistakeBadge');
      if (mistakeIds.size > 0) {
        mistakeBadge.innerText = mistakeIds.size;
        mistakeBadge.classList.remove('hidden');
      } else {
        mistakeBadge.classList.add('hidden');
      }

      const starredBadge = document.getElementById('starredBadge');
      if (starredIds.size > 0) {
        starredBadge.innerText = starredIds.size;
        starredBadge.classList.remove('hidden');
      } else {
        starredBadge.classList.add('hidden');
      }
    }

    function updateGlobalStats() {
      let answeredCount = 0;
      let correctCount = 0;

      QUESTIONS.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          answeredCount++;
          if (userAnswers[q.id] === q.answer) correctCount++;
        }
      });

      document.getElementById('answeredCount').innerText = `${answeredCount}/${QUESTIONS.length}`;
      const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('accuracyRate').innerText = `${rate}%`;
    }

    function openDrawer() {
      const grid = document.getElementById('drawerGrid');
      grid.innerHTML = '';

      filteredQuestions.forEach((q, idx) => {
        const cell = document.createElement('button');
        const ans = userAnswers[q.id];
        const isCurrent = idx === currentIndex;
        const isStarred = starredIds.has(q.id);

        let bgClass = "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300";
        if (ans !== undefined) {
          if (currentMode === 'exam' && !examSubmitted) {
            bgClass = "bg-indigo-500 text-white font-bold";
          } else {
            bgClass = ans === q.answer ? "bg-emerald-500 text-white font-bold" : "bg-rose-500 text-white font-bold";
          }
        }

        cell.className = `h-11 rounded-xl flex flex-col items-center justify-center relative font-semibold transition-transform active:scale-95 ${bgClass} ${
          isCurrent ? 'ring-2 ring-indigo-600 ring-offset-2 dark:ring-offset-slate-900' : ''
        }`;

        cell.onclick = () => {
          currentIndex = idx;
          closeDrawer();
          renderApp();
        };

        cell.innerHTML = `
          <span>${idx + 1}</span>
          ${isStarred ? '<span class="absolute top-1 right-1 text-[8px] text-amber-300"><i class="fa-solid fa-star"></i></span>' : ''}
        `;
        grid.appendChild(cell);
      });

      document.getElementById('drawerOverlay').classList.remove('hidden');
    }

    function closeDrawer(e) {
      if (e && e.target !== document.getElementById('drawerOverlay') && e.target !== undefined) return;
      document.getElementById('drawerOverlay').classList.add('hidden');
    }

    function openExamSubmitConfirm() {
      let unans = 0;
      filteredQuestions.forEach(q => {
        if (userAnswers[q.id] === undefined) unans++;
      });

      const desc = unans > 0 
        ? `您尚有 ${unans} 題未作答，確定現在交卷嗎？` 
        : `全部題目均已作答完成，確定要交卷結算成績嗎？`;

      openCustomConfirm("確認交卷？", desc, submitExam, "fa-paper-plane");
    }

    function submitExam() {
      examSubmitted = true;
      let correct = 0;
      let wrong = 0;

      filteredQuestions.forEach(q => {
        const userA = userAnswers[q.id];
        if (userA === q.answer) {
          correct++;
        } else {
          wrong++;
          mistakeIds.add(q.id);
        }
      });

      saveStorage();
      renderApp();

      // Show Result Modal
      const total = filteredQuestions.length;
      const score = Math.round((correct / total) * 100);
      document.getElementById('resultScore').innerText = `${score}分`;
      document.getElementById('resultCorrect').innerText = correct;
      document.getElementById('resultWrong').innerText = wrong;

      document.getElementById('examResultModal').classList.remove('hidden');
      document.getElementById('examResultModal').classList.add('flex');
    }

    function reviewExamMistakes() {
      closeResultModal();
      switchMode('mistakes');
    }

    function retryExam() {
      closeResultModal();
      // Clear answers in current set
      filteredQuestions.forEach(q => {
        delete userAnswers[q.id];
      });
      saveStorage();
      currentIndex = 0;
      examSubmitted = false;
      renderApp();
      showToast("測驗已重新開始！", "fa-rotate-left");
    }

    function closeResultModal() {
      document.getElementById('examResultModal').classList.add('hidden');
      document.getElementById('examResultModal').classList.remove('flex');
    }

    function openResetModal() {
      openCustomConfirm(
        "重設所有練習紀錄？",
        "這將會清除您所有的作答答案、錯題本與收藏標記，回到初始狀態。",
        resetAllProgress,
        "fa-rotate-right"
      );
    }

    function resetAllProgress() {
      userAnswers = {};
      mistakeIds.clear();
      starredIds.clear();
      localStorage.removeItem('p1_answers');
      localStorage.removeItem('p1_mistakes');
      localStorage.removeItem('p1_starred');
      currentIndex = 0;
      examSubmitted = false;
      renderApp();
      showToast("已重置所有刷題進度！", "fa-check");
    }

    function openCustomConfirm(title, desc, callback, icon = "fa-triangle-exclamation") {
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmDesc').innerText = desc;
      document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid ${icon}"></i>`;
      confirmCallback = callback;
      document.getElementById('confirmModal').classList.remove('hidden');
      document.getElementById('confirmModal').classList.add('flex');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      document.getElementById('confirmModal').classList.remove('flex');
      confirmCallback = null;
    }

    function runConfirmCallback() {
      if (confirmCallback) confirmCallback();
      closeConfirmModal();
    }

    // Keyboard shortcuts for convenience (Desktop testing)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextQuestion();
      if (e.key === 'ArrowLeft') prevQuestion();
    });

    // Boot App on load
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadStorage();
      filterQuestions();
      renderApp();
    });
  </script>
</body>
</html>
